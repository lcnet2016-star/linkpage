name: Update CMS Cache

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CMS directory
        run: mkdir -p data/cms

      - name: Fetch CMS JSON
        run: |
          BASE_URL="https://script.google.com/macros/s/AKfycbyyhzKs--PsnAylt-bAgGeTOpMV14CrvJieNXsaIBYSDUrlWl0PXmhm_FvhrYKf65QqRw/exec"

          curl -L --fail --silent \
            "$BASE_URL?page_id=facebook" \
            -o data/cms/facebook.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=instagram" \
            -o data/cms/instagram.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=tiktok" \
            -o data/cms/tiktok.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=x" \
            -o data/cms/x.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=youtube" \
            -o data/cms/youtube.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=pornhub" \
            -o data/cms/pornhub.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=x18" \
            -o data/cms/x18.json

      - name: Validate JSON
        run: |
          for file in data/cms/*.json; do
            jq -e '.success == true' "$file" > /dev/null
          done

      - name: Commit updated CMS cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cms

          if git diff --cached --quiet; then
            echo "No CMS changes"
            exit 0
          fi

          git commit -m "Update CMS cache"
          git push
