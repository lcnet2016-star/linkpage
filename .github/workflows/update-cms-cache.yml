name: Update CMS Cache

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create cache directories
        run: |
          mkdir -p data/cms
          mkdir -p data/content

      # ==========================================
      # リンク集CMS
      # ==========================================
      - name: Fetch CMS JSON
        run: |
          BASE_URL="https://script.google.com/macros/s/AKfycbyyhzKs--PsnAylt-bAgGeTOpMV14CrvJieNXsaIBYSDUrlWl0PXmhm_FvhrYKf65QqRw/exec"

          curl -L --fail --silent \
            "$BASE_URL?page_id=facebook" \
            -o data/cms/facebook.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=instagram" \
            -o data/cms/instagram.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=tiktok" \
            -o data/cms/tiktok.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=x" \
            -o data/cms/x.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=youtube" \
            -o data/cms/youtube.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=pornhub" \
            -o data/cms/pornhub.json

          curl -L --fail --silent \
            "$BASE_URL?page_id=x18" \
            -o data/cms/x18.json

      # ==========================================
      # 作品DB
      # ==========================================
      - name: Fetch Content DB JSON
        run: |
          CONTENT_URL="https://script.google.com/macros/s/AKfycbxT_J40PjHDRD-sGVGrM3zPA8Loj7XV9yDV988lkMB7rXVQ7Epka8ZK8aOdYI5NriY1/exec"

          curl -L --fail --silent \
            "$CONTENT_URL" \
            -o data/content/nsfw.json

      # ==========================================
      # JSON検証
      # ==========================================
      - name: Validate CMS JSON
        run: |
          for file in data/cms/*.json; do
            jq -e '.success == true' "$file" > /dev/null
          done

      - name: Validate Content DB JSON
        run: |
          jq -e '
            (.myfans_latest | type == "array") and
            (.other_bn | type == "array")
          ' data/content/nsfw.json > /dev/null

      # ==========================================
      # GitHubへ保存
      # ==========================================
      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cms data/content

          if git diff --cached --quiet; then
            echo "No cache changes"
            exit 0
          fi

          git commit -m "Update CMS and content cache"
          git push
