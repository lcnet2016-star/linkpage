    // Start catalogue loading independently of the campaign and SNS feeds.
    const polarisReadInitialCatalogue = (() => {
      const path = "/data/content/nsfw.json";
      let initial = fetch(path, {cache:"no-store", redirect:"error"}).then(
        res => res.ok ? res.json() : Promise.reject(new Error("HTTP " + res.status))
      ).then(data => ({data}), error => ({error}));
      return async () => {
        const first = initial;
        initial = null;
        if (first) {
          const result = await first;
          if (result.error) throw result.error;
          return result.data;
        }
        const res = await fetch(path, {cache:"no-store", redirect:"error"});
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      };
    })();

  <script>
(() => {
  "use strict";

  const routes = new Map();

  const num = (value) => {
    if (value === undefined || value === null || value === "") return NaN;
    const n = Number(value);
    return Number.isFinite(n) && n >= 0 ? n : NaN;
  };
  const asArray = (value) => Array.isArray(value) ? value : [];
  const candidates = (data) => [...asArray(data?.campaigns), ...asArray(data?.upcoming)];
  const campaignId = (c) => c?.id === null || c?.id === undefined ? "" : String(c.id);
  const isExcluded = (c) => !c || c.enabled === false ||
    ["draft", "private", "archived", "disabled"].includes(String(c.status || "").toLowerCase());
  const published = (c, now) => {
    const start = num(c.publish_at_ms);
    return !isExcluded(c) && (!Number.isFinite(start) || now >= start);
  };

  function campaignView(data, now = Date.now()) {
    const v = data || {};
    const campaigns = asArray(v.campaigns).filter((c) => {
      if (!published(c, now)) return false;
      const start = num(c.start_at_ms), end = num(c.end_at_ms);
      if (Number.isFinite(start) && now < start) return false;
      if (Number.isFinite(end) && now >= end) return false;
      return true;
    });
    const activeIds = new Set(campaigns.map(campaignId).filter(Boolean));
    const upcoming = asArray(v.upcoming).filter((c) => {
      if (!published(c, now) || activeIds.has(campaignId(c))) return false;
      const start = num(c.start_at_ms), end = num(c.end_at_ms);
      return (!Number.isFinite(start) || now < start) && (!Number.isFinite(end) || now < end);
    });
    return {...v, campaigns, upcoming};
  }

  function nextBoundary(data, now) {
    let next = Infinity;
    for (const c of candidates(data)) {
      if (isExcluded(c)) continue;
      for (const n of [num(c.publish_at_ms), num(c.start_at_ms), num(c.end_at_ms)]) {
        if (Number.isFinite(n) && n > now && n < next) next = n;
      }
    }
    return next;
  }

  function showTeaserTime(ms) {
    const timestamp = num(ms);
    if (!Number.isFinite(timestamp)) return "";
    const pieces = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Tokyo", month: "numeric", day: "numeric",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).formatToParts(new Date(timestamp));
    const f = Object.fromEntries(pieces.map(({type, value}) => [type, value]));
    return `${f.month}/${f.day} ${f.hour}:${f.minute} JST`;
  }

  function watchCampaignFeed(key, read, render, {initial = null, missing = () => {}, retainOnError = true, requireFreshCampaigns = false} = {}) {
    if (routes.has(key)) {
      const existing = routes.get(key);
      existing.render = render;
      existing.show();
      return existing.refresh();
    }
    let current = initial;
    let campaignsFresh = false;
    let timer = null;
    let pending = null;
    function schedule() {
      if (timer !== null) clearTimeout(timer);
      timer = null;
      const now = Date.now(), next = nextBoundary(current, now);
      if (!Number.isFinite(next)) return;
      timer = setTimeout(() => {
        show();
        refresh();
      }, Math.min(next - now, 2147483647));
    }
    function show() {
      if (current) entry.render(campaignView(requireFreshCampaigns && !campaignsFresh ? {...current, campaigns: [], upcoming: []} : current));
      else missing();
      schedule();
    }
    function refresh() {
      if (pending) return pending;
      pending = Promise.resolve()
        .then(read)
        .then((data) => {
          if (!data || typeof data !== "object") throw new Error("Missing campaign data");
          current = data;
          campaignsFresh = true;
        })
        .catch(() => { campaignsFresh = false; if (!retainOnError) current = null; })
        .finally(() => { pending = null; show(); });
      return pending;
    }
    const entry = {render, show, refresh};
    routes.set(key, entry);
    if (initial) show();
    setInterval(refresh, 30_000);
    return refresh();
  }

  async function getPublicJson(path, match) {
    if (!/^\/data\/(?:cms|content)\/[a-zA-Z0-9._-]+\.json$/.test(path)) {
      throw new Error("Unsupported public JSON path");
    }
    const res = await fetch(path, {cache: "no-store", redirect: "error"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data || (match && !match(data))) throw new Error("Invalid public JSON shape");
    return data;
  }

  function safeHref(value) {
    if (typeof value !== "string" || !value || /[\x00-\x20\\]/.test(value)) return null;
    if (value.startsWith("/") && !value.startsWith("//")) return value;
    if (!value.startsWith("https://")) return null;
    try {
      const url = new URL(value);
      return url.username || url.password ? null : url.href;
    } catch { return null; }
  }

  function isManagedCampaignFeed(data) {
    if (!data || data.success !== true || !Array.isArray(data.campaigns) || !Array.isArray(data.upcoming)) return false;
    const declared = new Set();
    function check(c, teaser) {
      if (!c || isExcluded(c) || !campaignId(c) || typeof c.title !== "string" || !c.title.trim()) return false;
      if (declared.has(campaignId(c))) return false;
      declared.add(campaignId(c));
      const start = num(c.start_at_ms), end = num(c.end_at_ms);
      if (!Number.isSafeInteger(start) || (c.end_at_ms !== undefined && (!Number.isSafeInteger(end) || end <= start))) return false;
      if (c.publish_at_ms !== undefined && !Number.isSafeInteger(num(c.publish_at_ms))) return false;
      if (teaser) {
        const keys = new Set(["id", "title", "publish_at_ms", "start_at_ms", "end_at_ms", "enabled", "status"]);
        return Object.keys(c).every(k => keys.has(k));
      }
      return Number.isSafeInteger(end) && Array.isArray(c.links) && c.links.length <= 4
        && c.links.every(l => l && safeHref(l.url) && typeof l.text === "string")
        && (c.image_url == null || c.image_url === "" || !!safeHref(c.image_url));
    }
    return data.campaigns.every(c => check(c, false)) && data.upcoming.every(c => check(c, true));
  }

  function withSaleUtm(value, target) {
    const url = safeHref(value);
    if (!url) return "#";
    const u = new URL(url, location.origin);
    for (const [k, v] of Object.entries({utm_source: "site", utm_medium: "lp", utm_campaign: "cf_sale", utm_content: target})) {
      u.searchParams.set(k, v);
    }
    return u.origin === location.origin ? u.pathname + u.search + u.hash : u.href;
  }

  window.PolarisStatic = Object.freeze({
    asArray, campaignView, showTeaserTime, watchCampaignFeed, getPublicJson, safeHref, withSaleUtm, isManagedCampaignFeed,
  });
})();

</script>
  <script>
    // ===== 背景 =====
    const BG = {
      morning:"../images/morning.png",
      evening:"../images/evening.jpg",
      night:"../images/night.jpg"
    };

    function pickBgByTime(){
      const h = new Date().getHours();
      if(h >= 5 && h < 16) return BG.morning;
      if(h >= 16 && h < 19) return BG.evening;
      return BG.night;
    }

    function applyBgModeByAspect(imgUrl){
      const img = new Image();

      img.onload = () => {
        const portrait = img.naturalHeight > img.naturalWidth;

        document.documentElement.style.setProperty(
          "--bgSize",
          portrait ? "contain" : "cover"
        );

        document.documentElement.style.setProperty(
          "--veilOpacity",
          portrait
            ? getComputedStyle(document.documentElement)
                .getPropertyValue("--veilOpacityPortrait").trim()
            : ".30"
        );
      };

      img.onerror = () => {
        document.documentElement.style.setProperty("--bgSize","cover");
        document.documentElement.style.setProperty("--veilOpacity",".30");
      };

      img.src = imgUrl;
    }

    function setBG(){
      const imgUrl = pickBgByTime();
      document.body.style.backgroundImage = `url('${imgUrl}')`;
      applyBgModeByAspect(imgUrl);
    }

    setBG();

    // ===== API =====
    const API_URL = "/data/content/nsfw.json";

    const CMS_API_URL = "/data/content/links-campaigns.json";


    const FALLBACK_IMAGE = "../images/NY.jpg";

    function escHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getLang(){
      try{
        return localStorage.getItem("lang") === "en" ? "en" : "ja";
      }catch(e){
        return "ja";
      }
    }

    // 「Fantiaで見る」などをEN時だけ「View on Fantia」へ
    function translateButtonText(text, lang){
      const source = String(text || "").trim();

      if(lang !== "en") return source || "見る";

      const known = {
        "CandFansで見る":"View on CandFans",
        "MyFansで見る":"View on MyFans",
        "Fantiaで見る":"View on Fantia",
        "OnlyFansで見る":"View on OnlyFans",
        "ReelFansで見る":"View on ReelFans"
      };

      if(known[source]) return known[source];

      const match = source.match(/^(.+?)で見る$/);
      if(match) return `View on ${match[1]}`;

      return source || "View";
    }

    function thumbHtml(image, alt){
      const src = image || FALLBACK_IMAGE;

      return `
        <div class="thumb-wrap">
          <img class="thumb-bg" src="${escHtml(src)}" alt="" aria-hidden="true">
          <img class="thumb" src="${escHtml(src)}" alt="${escHtml(alt || "")}">
        </div>
      `;
    }

    // ===== CMS：期間限定 =====
    function formatUpcomingText(item, lang){
      const time = PolarisStatic.showTeaserTime(item.start_at_ms);

      if(lang === "en"){
        return `${time} Coming soon!?`;
      }

      return `${time}から開催予定！？`;
    }

    function renderCampaignCard(c){
      const lang = getLang();
      const image = c.image_url || FALLBACK_IMAGE;

      const buttons = Array.isArray(c.links)
        ? c.links
            .filter(link => link && link.url)
            .slice(0,4)
            .map((link,index) => {
              const cls = index === 0 ? "btn btn-main" : "btn btn-sub";
              const label = translateButtonText(link.text, lang);

              return `
                <a
                  class="${cls}"
                  href="${escHtml(link.url)}"
                  target="_blank"
                  rel="noopener"
                >${escHtml(label)}</a>
              `;
            })
            .join("")
        : "";

      return `
        <div class="vcard">
          ${thumbHtml(image, c.title || "")}
          <div class="vmeta">
            <div class="vtitle">${escHtml(c.title || "")}</div>
            ${buttons}
          </div>
        </div>
      `;
    }

    function renderUpcomingCard(item){
      const lang = getLang();

      return `
        <div class="vcard">
          ${thumbHtml(FALLBACK_IMAGE, item.title || "")}
          <div class="vmeta">
            <div class="vtitle">${escHtml(item.title || "")}</div>
            <div class="preview-date">
              ${escHtml(formatUpcomingText(item, lang))}
            </div>
          </div>
        </div>
      `;
    }

    function renderUpcomingGroups(items) {
      const groups = new Map();
      for (const item of items) {
        if (!item || !Number.isSafeInteger(item.start_at_ms)) continue;
        const title = typeof item.title === "string" ? item.title.trim() : "";
        if (!title) continue;
        if (!groups.has(item.start_at_ms)) groups.set(item.start_at_ms, []);
        groups.get(item.start_at_ms).push(title);
      }
      const lang = getLang();
      return Array.from(groups).sort((a,b) => a[0]-b[0]).map(([start,titles]) => {
        const time = PolarisStatic.showTeaserTime(start).replace(/\s+JST$/, "");
        const heading = lang === "en" ? `Coming ${time} (JST)!` : `${time} から開催予定！`;
        return `<div class="campaign-preview-text campaign-teaser-group"><strong>${escHtml(heading)}</strong>` +
          `<ul class="campaign-teaser-titles">${titles.map(title => `<li>${escHtml(title)}</li>`).join("")}</ul></div>`;
      }).join("");
    }

    function renderLinksCampaigns_(data) {
      const section = document.getElementById("campaignSection");
      const grid = document.getElementById("campaignGrid");
      const campaigns = PolarisStatic.asArray(data.campaigns);
      const upcoming = PolarisStatic.asArray(data.upcoming);
      section.hidden = !campaigns.length && !upcoming.length;
      if (section.hidden) { grid.innerHTML = ""; return; }
      if (!campaigns.length) { grid.innerHTML = renderUpcomingGroups(upcoming); return; }
      grid.innerHTML = campaigns.map(renderCampaignCard).join("") + renderUpcomingGroups(upcoming);
    }

    async function loadCampaigns(){
      return PolarisStatic.watchCampaignFeed(CMS_API_URL,
        () => PolarisStatic.getPublicJson(CMS_API_URL, PolarisStatic.isManagedCampaignFeed),
        data => {
          document.getElementById("campaignSection").setAttribute("data-polaris-campaign-state", "managed");
          renderLinksCampaigns_(data);
        },
        {retainOnError: false, missing: () => {
          document.getElementById("campaignSection").setAttribute("data-polaris-campaign-state", "unavailable");
          renderLinksCampaigns_({});
        }});
    }

    // ===== 既存作品 =====
    async function loadVideos(){
      const nowGrid = document.getElementById("videoGrid");
      const popGrid = document.getElementById("popularGrid");
      const lang = getLang();

      const candfansText =
        lang === "en" ? "View on CandFans" : "CandFansで見る";

      const myfansText =
        lang === "en" ? "View on MyFans" : "MyFansで見る";

      const renderCard = (v) => {
        const title =
          lang === "en" && v.translation
            ? v.translation
            : v.title;

        return `
          <div class="vcard">
            ${thumbHtml(v.thumb_url || FALLBACK_IMAGE, title || "")}

            <div class="vmeta">
              <div class="vtitle">${escHtml(title || "")}</div>

              ${
                v.url_CF
                  ? `<a class="btn btn-main"
                       href="${escHtml(v.url_CF)}"
                       target="_blank"
                       rel="noopener">${candfansText}</a>`
                  : ""
              }

              ${
                v.url_MY
                  ? `<a class="btn btn-sub"
                       href="${escHtml(v.url_MY)}"
                       target="_blank"
                       rel="noopener">${myfansText}</a>`
                  : ""
              }
            </div>
          </div>
        `;
      };

      try{
        const data = await polarisReadInitialCatalogue();

        const nowList = (data.myfans_latest || [])
          .sort((a,b)=>Number(a.order)-Number(b.order))
          .slice(0,3);

        const popList = (data.other_bn || [])
          .sort((a,b)=>Number(a.order)-Number(b.order))
          .slice(0,3);

        const emptyText =
          lang === "en" ? "Coming soon" : "準備中";

        nowGrid.innerHTML = nowList.length
          ? nowList.map(renderCard).join("")
          : `<div style="opacity:.9;font-weight:800;text-shadow:var(--textShadow);">${emptyText}</div>`;

        popGrid.innerHTML = popList.length
          ? popList.map(renderCard).join("")
          : `<div style="opacity:.9;font-weight:800;text-shadow:var(--textShadow);">${emptyText}</div>`;

      }catch(error){
        console.error("Video API load error:",error);

        const errorText =
          lang === "en"
            ? "Failed to load"
            : "読み込みに失敗しました";

        nowGrid.innerHTML =
          `<div style="opacity:.9;font-weight:800;text-shadow:var(--textShadow);">${errorText}</div>`;

        popGrid.innerHTML = "";
      }
    }

    // ===== SNS当日更新表示 =====
    const I18N = {
      ja:{
        htmlLang:"ja",
        title:"のあ୨୧",
        sub:"田舎で暮らす陰キャ女子",
        secCampaign:"🎉 期間限定",
        secNow:"🔥 今すぐ見る",
        secPop:"⭐ 人気3本",
        secSub:"💎 月額で全部見る"
      },
      en:{
        htmlLang:"en",
        title:"Noa",
        sub:"Quiet countryside girl",
        secCampaign:"🎉 Limited time",
        secNow:"🔥 Watch now",
        secPop:"⭐ Popular 3",
        secSub:"💎 Subscribe monthly"
      }
    };

    function setLang(lang){
      const t = I18N[lang] || I18N.ja;

      document.documentElement.lang = t.htmlLang;
      document.getElementById("tTitle").textContent = t.title;
      document.getElementById("tSub").textContent = t.sub;
      document.getElementById("secCampaign").textContent = t.secCampaign;
      document.getElementById("secNow").textContent = t.secNow;
      document.getElementById("secPop").textContent = t.secPop;
      document.getElementById("secSub").textContent = t.secSub;

      document.getElementById("btnJP")
        .classList.toggle("is-active",lang === "ja");

      document.getElementById("btnEN")
        .classList.toggle("is-active",lang === "en");

      try{
        localStorage.setItem("lang",lang);
      }catch(e){}

      /* 言語切替で各表示を再描画 */
      loadCampaigns();
      loadVideos();
    }

    (function initLang(){
      let saved = "ja";

      try{
        saved = localStorage.getItem("lang") || "ja";
      }catch(e){}

      setLang(saved === "en" ? "en" : "ja");
    })();
  </script>
</body>
</html>
