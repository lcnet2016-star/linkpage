<!doctype html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VSEFPGK0YZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VSEFPGK0YZ');

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Noa | links</title>
  <meta name="description" content="Noa links" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap" rel="stylesheet">

  <style>
    :root{
      --bgBase:#fff0ebff;
      --bgSize:cover;
      --bgRepeat:no-repeat;
      --bgPos:center;
      --bgTransition:1s;
      --veilOpacity:.30;
      --veilOpacityPortrait:.42;

      --fontFamily:"M PLUS Rounded 1c", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      --titleFont:"Hachi Maru Pop", cursive;

      --containerMax:760px;
      --padTop:30px;
      --padSide:16px;
      --padBottom:40px;

      --titleSize:38px;
      --subtitleSize:18px;
      --titleColor:#fff;
      --subtitleColor:rgba(255,255,255,.9);
      --textShadow:0 6px 20px rgba(0,0,0,.35);

      --snsSize:88px;
      --snsIconSize:40px;
      --snsGap:10px;
      --snsRadius:14px;

      --cardBg:rgba(255,255,255,.25);
      --cardBorder:rgba(255,255,255,.28);
      --cardRadius:22px;
      --cardShadow:0 18px 50px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.35);

      --sectionPad:18px;
      --brand:#A67189;

      --footerColor:rgba(255,255,255,.78);
      --footerSize:12px;

      --langGap:10px;
      --langMt:14px;
      --langBtnH:34px;
      --langBtnPx:14px;
      --langBtnRadius:12px;
      --langBtnBg:rgba(255,255,255,.25);
      --langBtnBorder:rgba(255,255,255,.28);
      --langBtnText:rgba(255,255,255,.92);
      --langBtnBgActive:rgba(255,255,255,.40);
      --langBtnTextActive:rgba(255,255,255,1);
    }

    @media (max-width:420px){
      :root{
        --padTop:22px;
        --titleSize:30px;
        --subtitleSize:16px;
        --snsSize:72px;
        --snsIconSize:34px;
        --langBtnH:32px;
        --langBtnPx:12px;
        --sectionPad:16px;
      }
    }

    html,body{height:100%}

    body{
      margin:0;
      font-family:var(--fontFamily);
      color:var(--titleColor);
      background-color:var(--bgBase);
      background-image:none;
      background-size:var(--bgSize);
      background-repeat:var(--bgRepeat);
      background-position:var(--bgPos);
      background-attachment:fixed;
      transition:background-image var(--bgTransition) ease-in-out;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(255,240,235,var(--veilOpacity));
      z-index:-1;
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:var(--padTop) var(--padSide) var(--padBottom);
      text-align:center;
      box-sizing:border-box;
    }

    .container{
      width:100%;
      max-width:var(--containerMax);
      margin:0 auto;
      padding-left:max(16px, env(safe-area-inset-left));
      padding-right:max(16px, env(safe-area-inset-right));
      box-sizing:border-box;
    }

    .title{
      margin:0 0 6px;
      font-family:var(--titleFont);
      font-size:var(--titleSize);
      font-weight:900;
      text-shadow:var(--textShadow);
    }

    .subtitle{
      margin:0 0 10px;
      font-size:var(--subtitleSize);
      font-weight:800;
      color:var(--subtitleColor);
      text-shadow:var(--textShadow);
    }

    .section{
      width:100%;
      margin:0 0 16px;
      background:var(--cardBg);
      border:1px solid var(--cardBorder);
      border-radius:var(--cardRadius);
      box-shadow:var(--cardShadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      padding:var(--sectionPad);
      text-align:left;
      box-sizing:border-box;
    }

    .section h2{
      margin:0 0 12px;
      font-size:18px;
      font-weight:900;
      text-shadow:var(--textShadow);
      text-align:left;
    }

    .grid{
      display:grid;
      gap:14px;
      grid-template-columns:repeat(3,1fr);
      align-items:stretch;
    }

    @media (orientation:portrait){
      .grid{grid-template-columns:repeat(2,1fr)}
    }

    @media (max-width:360px){
      .grid{grid-template-columns:1fr}
    }

    .vcard{
      background:rgba(255,255,255,.20);
      border:1px solid rgba(255,255,255,.22);
      border-radius:18px;
      overflow:hidden;
      color:#fff;
      display:flex;
      flex-direction:column;
      height:100%;
      min-width:0;
    }

    /* 常に1:1。16:9 / 9:16は背景を同画像の拡大ぼかしで補完 */
    .thumb-wrap{
      position:relative;
      width:100%;
      aspect-ratio:1 / 1;
      overflow:hidden;
      background:rgba(255,255,255,.18);
    }

    .thumb-bg{
      position:absolute;
      inset:-10%;
      width:120%;
      height:120%;
      object-fit:cover;
      filter:blur(18px) brightness(.62);
      opacity:.52;
      transform:scale(1.08);
      pointer-events:none;
      user-select:none;
    }

    .thumb{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      background:transparent;
    }

    .vmeta{
      padding:10px;
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:0;
    }

    .vtitle{
      font-weight:900;
      font-size:14px;
      line-height:1.35;
      margin:0 0 10px;
      text-shadow:var(--textShadow);
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
      overflow:hidden;
      min-height:calc(14px * 1.35 * 2);
    }

    .btn{
      display:block;
      text-align:center;
      padding:10px;
      border-radius:14px;
      font-weight:900;
      text-decoration:none;
      margin-bottom:8px;
      border:1px solid rgba(255,255,255,.18);
      box-sizing:border-box;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:14px;
    }

    .btn:last-child{margin-bottom:0}

    .btn-main{
      background:var(--brand);
      color:#fff;
    }

    .btn-sub{
      background:rgba(166,113,137,.20);
      color:#fff;
    }

    @media (orientation:portrait){
      .vtitle{
        font-size:13px;
        min-height:calc(13px * 1.35 * 2);
      }
      .btn{
        font-size:13px;
        padding:9px;
      }
    }

    .fc-btns{
      display:grid;
      gap:10px;
      margin-top:8px;
      grid-template-columns:repeat(4,1fr);
      align-items:stretch;
    }

    @media (max-width:900px){
      .fc-btns{grid-template-columns:repeat(2,1fr)}
    }

    @media (max-width:480px){
      .fc-btns{grid-template-columns:1fr}
    }

    .fc-btn{
      margin:0 !important;
      padding:10px 0;
      border-radius:12px;
      min-width:0;
    }

    .fc-btn.btn-sub{
      border-color:rgba(255,255,255,.10);
    }

    .social{
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:var(--snsGap);
      margin:0 0 16px;
    }

    .social-item{
      width:var(--snsSize);
      display:flex;
      flex-direction:column;
      align-items:center;
      min-width:0;
    }

    .social-item a{
      width:var(--snsSize);
      height:var(--snsSize);
      display:grid;
      place-items:center;
      border-radius:var(--snsRadius);
      text-decoration:none;
      background:transparent;
    }

    .social-item img{
      width:var(--snsIconSize);
      height:var(--snsIconSize);
      display:block;
      filter:brightness(0) invert(1);
    }

    .social-update{
      min-height:14px;
      margin-top:4px;
      font-size:11px;
      line-height:1;
      font-weight:600;
      color:rgba(255,255,255,.92);
      text-align:center;
      white-space:nowrap;
      text-shadow:var(--textShadow);
    }

    @media (max-width:420px){
      .social-update{
        min-height:13px;
        margin-top:3px;
        font-size:10px;
        line-height:1;
      }
    }

    /* JP / EN はページ最下部 */
    .lang{
      margin-top:var(--langMt);
      display:flex;
      justify-content:center;
      gap:var(--langGap);
    }

    .lang button{
      height:var(--langBtnH);
      padding:0 var(--langBtnPx);
      border-radius:var(--langBtnRadius);
      background:var(--langBtnBg);
      border:1px solid var(--langBtnBorder);
      color:var(--langBtnText);
      font-weight:900;
      font-family:var(--fontFamily);
      cursor:pointer;
      text-shadow:var(--textShadow);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transition:filter .18s ease,transform .08s ease,background .18s ease,color .18s ease;
    }

    .lang button:hover{filter:brightness(1.08)}
    .lang button:active{transform:scale(.98)}
    .lang button.is-active{
      background:var(--langBtnBgActive);
      color:var(--langBtnTextActive);
    }

    .foot{
      margin-top:10px;
      font-size:var(--footerSize);
      color:var(--footerColor);
      text-shadow:var(--textShadow);
      text-align:center;
    }


    .campaign-preview-text{
      grid-column:1 / -1;
      padding:10px 4px 2px;
      text-align:left;
      color:#fff;
      font-weight:900;
      line-height:1.65;
      text-shadow:var(--textShadow);
    }

    .campaign-preview-text .preview-title{
      display:block;
      font-size:16px;
      margin-bottom:2px;
    }

    .preview-date{
      margin-top:auto;
      color:#fff;
      font-size:13px;
      font-weight:900;
      line-height:1.45;
      text-shadow:var(--textShadow);
    }

    .recommend-hint{
      margin:-4px 0 12px;
      font-size:13px;
      font-weight:800;
      color:rgba(255,255,255,.92);
      text-shadow:var(--textShadow);
    }

    .draw-btn{
      width:100%; margin-top:14px; padding:12px;
      border:1px solid rgba(255,255,255,.28); border-radius:14px;
      background:rgba(166,113,137,.75); color:#fff;
      font-family:var(--fontFamily); font-size:14px; font-weight:900;
      cursor:pointer; text-shadow:var(--textShadow);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      transition:filter .18s ease,transform .08s ease;
    }
    .draw-btn:hover{filter:brightness(1.08)}
    .draw-btn:active{transform:scale(.99)}

    [hidden]{display:none !important}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="container">

      <h1 class="title" id="tTitle">のあ୨୧</h1>
      <p class="subtitle" id="tSub">田舎で暮らす陰キャ女子</p>

      <!-- 期間限定：CMSに表示対象がある時だけ出る -->
      <div class="section" id="campaignSection" aria-label="Limited campaign" hidden>
        <h2 id="secCampaign">🎉 期間限定</h2>
        <div class="grid" id="campaignGrid"></div>
      </div>

      <!-- 今すぐ見る -->
      <div class="section" aria-label="Watch now">
        <h2 id="secNow">🔥 今すぐ見る</h2>
        <div class="grid" id="videoGrid"></div>
      </div>

      <!-- 今週のおすすめ -->
      <div class="section" aria-label="Weekly recommendations">
        <h2 id="secPop">⭐ 今週のおすすめ</h2>
        <div id="recommendHint" class="recommend-hint">今週はこの3本！もう一度引いてみる？</div>
        <div class="grid" id="popularGrid"></div>
        <button id="recommendDrawButton" class="draw-btn" type="button" onclick="drawRecommendations()">🎲 おすすめ3本を抽選する</button>
      </div>

      <!-- 月額：CMSから自動生成 -->
      <div class="section" id="monthlySection" aria-label="Subscribe monthly">
        <h2 id="secSub">💎 月額で全部見る</h2>
        <div class="fc-btns" id="monthlyButtons" aria-label="Fanclub links"></div>
      </div>

      <!-- SNS：CMSから自動生成 -->
      <div class="social" id="socialFooter" aria-label="SNS links"></div>

      <!-- 最下部にJP / EN -->
      <div class="lang" aria-label="Language switch">
        <button id="btnJP" type="button" onclick="setLang('ja')">JP</button>
        <button id="btnEN" type="button" onclick="setLang('en')">EN</button>
      </div>

      <div class="foot">© Noa</div>

    </div>
  </div>

  <script>
    // ===== 背景 =====
    function applyBackgroundFromCms_(backgrounds){
      const bg = backgrounds || {};
      const h = new Date().getHours();

      let slot = "night";
      if(h >= 5 && h < 16) slot = "morning";
      else if(h >= 16 && h < 19) slot = "evening";

      const imgUrl =
        bg[slot] ||
        bg.morning ||
        bg.evening ||
        bg.night ||
        FALLBACK_IMAGE;

      document.body.style.backgroundImage = `url('${imgUrl}')`;

      const img = new Image();

      img.onload = () => {
        const portrait = img.naturalHeight > img.naturalWidth;

        document.documentElement.style.setProperty(
          "--bgSize",
          portrait ? "contain" : "cover"
        );

        document.documentElement.style.setProperty(
          "--veilOpacity",
          portrait
            ? getComputedStyle(document.documentElement)
                .getPropertyValue("--veilOpacityPortrait").trim()
            : ".30"
        );
      };

      img.onerror = () => {
        document.documentElement.style.setProperty("--bgSize","cover");
        document.documentElement.style.setProperty("--veilOpacity",".30");
      };

      img.src = imgUrl;
    }

    // ===== API =====
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxT_J40PjHDRD-sGVGrM3zPA8Loj7XV9yDV988lkMB7rXVQ7Epka8ZK8aOdYI5NriY1/exec";

    const CONTENT_STATIC_URL =
      "/data/content/nsfw.json";

    const CONTENT_CACHE_KEY =
      "nsfw_content_cache";

    const PAGE_ID = "pornhub
    const CMS_API_URL =
      "https://script.google.com/macros/s/AKfycbyyhzKs--PsnAylt-bAgGeTOpMV14CrvJieNXsaIBYSDUrlWl0PXmhm_FvhrYKf65QqRw/exec";

    const CMS_STATIC_URL =
      `/data/cms/${PAGE_ID}.json`;

    const CMS_CACHE_KEY =
      `cms_cache_${PAGE_ID}`;


    const FALLBACK_IMAGE = "../images/NY.jpg";

    function escHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getLang(){
      try{
        return localStorage.getItem("lang") === "en" ? "en" : "ja";
      }catch(e){
        return "ja";
      }
    }

    // 「Fantiaで見る」などをEN時だけ「View on Fantia」へ
    function translateButtonText(text, lang){
      const source = String(text || "").trim();

      if(lang !== "en") return source || "見る";

      const known = {
        "CandFansで見る":"View on CandFans",
        "MyFansで見る":"View on MyFans",
        "Fantiaで見る":"View on Fantia",
        "OnlyFansで見る":"View on OnlyFans",
        "ReelFansで見る":"View on ReelFans"
      };

      if(known[source]) return known[source];

      const match = source.match(/^(.+?)で見る$/);
      if(match) return `View on ${match[1]}`;

      return source || "View";
    }

    function thumbHtml(image, alt){
      const src = image || FALLBACK_IMAGE;

      return `
        <div class="thumb-wrap">
          <img class="thumb-bg" src="${escHtml(src)}" alt="" aria-hidden="true">
          <img class="thumb" src="${escHtml(src)}" alt="${escHtml(alt || "")}">
        </div>
      `;
    }

    // ===== CMSブラウザキャッシュ =====
    function loadCachedCms_(){
      try{
        const raw = localStorage.getItem(CMS_CACHE_KEY);
        if(!raw) return null;

        const data = JSON.parse(raw);
        if(!data || data.success !== true) return null;

        return data;
      }catch(error){
        console.warn(
          "CMS cache read error:",
          error
        );
        return null;
      }
    }

    function saveCachedCms_(data){
      try{
        localStorage.setItem(
          CMS_CACHE_KEY,
          JSON.stringify(data)
        );
      }catch(error){
        console.warn(
          "CMS cache write error:",
          error
        );
      }
    }

    async function fetchCmsJson_(url){
      const res = await fetch(
        url,
        {cache:"no-store"}
      );

      if(!res.ok){
        throw new Error(
          "HTTP " + res.status
        );
      }

      const data = await res.json();

      if(
        !data ||
        data.success !== true
      ){
        throw new Error(
          data && data.error
            ? data.error
            : "Invalid CMS JSON"
        );
      }

      return data;
    }

    // ===== CMS：期間限定 =====
    function formatUpcomingText(item, lang){
      const date = new Date(Number(item.start_at_ms));

      const month = date.getMonth() + 1;
      const day = date.getDate();
      const hour = String(date.getHours()).padStart(2,"0");
      const minute = String(date.getMinutes()).padStart(2,"0");

      if(lang === "en"){
        return `${month}/${day} ${hour}:${minute} Coming soon!?`;
      }

      return `${month}/${day} ${hour}:${minute}から開催予定！？`;
    }

    function renderCampaignCard(c){
      const lang = getLang();
      const image = c.image_url || FALLBACK_IMAGE;

      const buttons = Array.isArray(c.links)
        ? c.links
            .filter(link => link && link.url)
            .slice(0,4)
            .map((link,index) => {
              const cls = index === 0 ? "btn btn-main" : "btn btn-sub";
              const label = translateButtonText(link.text, lang);

              return `
                <a
                  class="${cls}"
                  href="${escHtml(link.url)}"
                  target="_blank"
                  rel="noopener"
                >${escHtml(label)}</a>
              `;
            })
            .join("")
        : "";

      return `
        <div class="vcard">
          ${thumbHtml(image, c.title || "")}
          <div class="vmeta">
            <div class="vtitle">${escHtml(c.title || "")}</div>
            ${buttons}
          </div>
        </div>
      `;
    }

    function renderUpcomingCard(item){
      const lang = getLang();

      return `
        <div class="vcard">
          ${thumbHtml(FALLBACK_IMAGE, item.title || "")}
          <div class="vmeta">
            <div class="vtitle">${escHtml(item.title || "")}</div>
            <div class="preview-date">
              ${escHtml(formatUpcomingText(item, lang))}
            </div>
          </div>
        </div>
      `;
    }

    function renderUpcomingText(item){
      const lang = getLang();

      return `
        <div class="campaign-preview-text">
          <span class="preview-title">${escHtml(item.title || "")}</span>
          <span>${escHtml(formatUpcomingText(item, lang))}</span>
        </div>
      `;
    }

    function renderCampaignData_(data){
      // 同じCMS JSONから背景・SNS・月額FCも描画
      applyBackgroundFromCms_(data.backgrounds || {});
      renderSocialFromCms_(data);
      renderMonthlyFromCms_(data);

      const section = document.getElementById("campaignSection");
      const grid = document.getElementById("campaignGrid");

      if(!section || !grid) return;

      const campaigns = Array.isArray(data.campaigns)
        ? data.campaigns
        : [];

      const upcoming = Array.isArray(data.upcoming)
        ? data.upcoming
        : [];

      if(!campaigns.length && !upcoming.length){
        section.hidden = true;
        grid.innerHTML = "";
        return;
      }

      section.hidden = false;

      if(!campaigns.length && upcoming.length){
        grid.innerHTML =
          upcoming.map(renderUpcomingText).join("");
        return;
      }

      const liveCards =
        campaigns.map(renderCampaignCard).join("");

      const upcomingCards =
        upcoming.map(renderUpcomingCard).join("");

      grid.innerHTML =
        liveCards + upcomingCards;
    }

    async function loadCampaigns(){
      const section = document.getElementById("campaignSection");
      const grid = document.getElementById("campaignGrid");

      if(!section || !grid) return;

      // ① 前回CMSデータがあれば即表示
      const cached = loadCachedCms_();

      if(cached){
        renderCampaignData_(cached);
      }

      // ② GitHub静的JSONを優先
      try{
        const staticData = await fetchCmsJson_(
          CMS_STATIC_URL + "?v=" + Date.now()
        );

        saveCachedCms_(staticData);
        renderCampaignData_(staticData);
        return;

      }catch(staticError){
        console.warn(
          "Static CMS JSON load error:",
          staticError
        );
      }

      // ③ 静的JSON失敗時だけGASへフォールバック
      try{
        const gasData = await fetchCmsJson_(
          `${CMS_API_URL}?page_id=${encodeURIComponent(PAGE_ID)}&t=${Date.now()}`
        );

        saveCachedCms_(gasData);
        renderCampaignData_(gasData);

      }catch(gasError){
        console.error(
          "CMS GAS fallback error:",
          gasError
        );

        if(!cached){
          section.hidden = true;
          grid.innerHTML = "";
        }
      }
    }

    // ===== CMS：SNS =====
    function getTodayKeyJst_(){
      const parts = new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone:"Asia/Tokyo",
          year:"numeric",
          month:"2-digit",
          day:"2-digit"
        }
      ).formatToParts(new Date());

      const map = {};
      parts.forEach(part => {
        map[part.type] = part.value;
      });

      return `${map.year}-${map.month}-${map.day}`;
    }

    function getDateKeyJst_(value){
      if(!value) return "";

      const date = new Date(value);
      if(Number.isNaN(date.getTime())) return "";

      const parts = new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone:"Asia/Tokyo",
          year:"numeric",
          month:"2-digit",
          day:"2-digit"
        }
      ).formatToParts(date);

      const map = {};
      parts.forEach(part => {
        map[part.type] = part.value;
      });

      return `${map.year}-${map.month}-${map.day}`;
    }

    function getLatestPublishedMap_(data){
      const result = {};
      const sections = Array.isArray(data && data.sections)
        ? data.sections
        : [];

      sections.forEach(section => {
        const cards = Array.isArray(section.cards)
          ? section.cards
          : [];

        cards.forEach(card => {
          if(
            String(card.card_type || "").toLowerCase() !== "sns"
          ){
            return;
          }

          const key =
            String(card.source_key || "").toLowerCase();

          if(!key) return;

          result[key] = card.published_at || "";
        });
      });

      return result;
    }

    function renderSocialFromCms_(data){
      const root = document.getElementById("socialFooter");
      if(!root) return;

      const socials = Array.isArray(data && data.social)
        ? data.social
        : [];

      const publishedMap = getLatestPublishedMap_(data);
      const todayKey = getTodayKeyJst_();
      const lang = getLang();

      root.innerHTML = socials.map(item => {
        const snsKey =
          String(item.sns_id || "").toLowerCase();

        const publishedAt =
          publishedMap[snsKey] || "";

        const showToday =
          item.update_badge === true &&
          getDateKeyJst_(publishedAt) === todayKey;

        const badgeText =
          showToday
            ? (lang === "en" ? "Updated today!" : "本日更新！")
            : "";

        return `
          <div class="social-item">
            <a
              href="${escHtml(item.url || "#")}"
              target="_blank"
              rel="noopener"
              aria-label="${escHtml(item.name || item.sns_id || "")}"
            >
              <img
                loading="lazy"
                decoding="async"
                src="${escHtml(item.icon_url || "")}"
                alt="${escHtml(item.name || item.sns_id || "")}"
              >
            </a>
            <div class="social-update">
              ${escHtml(badgeText)}
            </div>
          </div>
        `;
      }).join("");
    }

    // ===== CMS：月額FC =====
    function findCmsSectionByCardGroup_(data, cardGroup){
      const sections = Array.isArray(data && data.sections)
        ? data.sections
        : [];

      return sections.find(section =>
        String(section.card_group || "") === cardGroup
      ) || null;
    }

    function renderMonthlyFromCms_(data){
      const sectionEl = document.getElementById("monthlySection");
      const buttonsEl = document.getElementById("monthlyButtons");

      if(!sectionEl || !buttonsEl) return;

      const section = findCmsSectionByCardGroup_(
        data,
        "nsfw_subscribe_jp"
      );

      const cards = section && Array.isArray(section.cards)
        ? section.cards
        : [];

      const buttons = [];

      cards.forEach((card, cardIndex) => {
        const links = Array.isArray(card.links)
          ? card.links
          : [];

        links.forEach((link, linkIndex) => {
          if(!link || !link.url) return;

          const label =
            String(card.title || "").trim() ||
            (
              getLang() === "en"
                ? (link.label_en || link.label_ja || "View")
                : (link.label_ja || link.label_en || "見る")
            );

          buttons.push(`
            <a
              class="${buttons.length === 0 ? "btn btn-main fc-btn" : "btn btn-sub fc-btn"}"
              href="${escHtml(link.url)}"
              target="_blank"
              rel="noopener"
            >${escHtml(label)}</a>
          `);
        });
      });

      if(!buttons.length){
        sectionEl.hidden = true;
        buttonsEl.innerHTML = "";
        return;
      }

      sectionEl.hidden = false;
      buttonsEl.innerHTML = buttons.join("");
    }

    // ===== 作品DBブラウザキャッシュ =====
    function loadCachedContent_(){
      try{
        const raw = localStorage.getItem(CONTENT_CACHE_KEY);
        if(!raw) return null;

        const data = JSON.parse(raw);

        if(
          !data ||
          !Array.isArray(data.myfans_latest) ||
          !Array.isArray(data.other_bn)
        ){
          return null;
        }

        return data;

      }catch(error){
        console.warn(
          "Content cache read error:",
          error
        );
        return null;
      }
    }

    function saveCachedContent_(data){
      try{
        localStorage.setItem(
          CONTENT_CACHE_KEY,
          JSON.stringify(data)
        );
      }catch(error){
        console.warn(
          "Content cache write error:",
          error
        );
      }
    }

    async function fetchContentJson_(url){
      const res = await fetch(
        url,
        {cache:"no-store"}
      );

      if(!res.ok){
        throw new Error(
          "HTTP " + res.status
        );
      }

      const data = await res.json();

      if(
        !data ||
        !Array.isArray(data.myfans_latest) ||
        !Array.isArray(data.other_bn)
      ){
        throw new Error(
          "Invalid content JSON"
        );
      }

      return data;
    }

    // ===== 今週のおすすめ / 閲覧者抽選 =====
    let currentContentData_ = null;
    let currentRecommendationList_ = null;
    let recommendationMode_ = "weekly";

    function getRandomItem_(items, excludeIds = []){
      const excluded = new Set(excludeIds.map(String));
      const pool = (items || []).filter(item =>
        item && item.video_id && !excluded.has(String(item.video_id))
      );
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }

    function renderRecommendationCards_(list){
      const grid = document.getElementById("popularGrid");
      if(!grid) return;
      const lang = getLang();
      const candfansText = lang === "en" ? "View on CandFans" : "CandFansで見る";
      const myfansText = lang === "en" ? "View on MyFans" : "MyFansで見る";
      const cards = (list || []).filter(Boolean);

      if(!cards.length){
        grid.innerHTML = `<div style="opacity:.9;font-weight:800;text-shadow:var(--textShadow);">${lang === "en" ? "Coming soon" : "準備中"}</div>`;
        return;
      }

      grid.innerHTML = cards.map(v => {
        const title = lang === "en" && v.translation ? v.translation : v.title;
        return `
          <div class="vcard">
            ${thumbHtml(v.thumb_url || FALLBACK_IMAGE, title || "")}
            <div class="vmeta">
              <div class="vtitle">${escHtml(title || "")}</div>
              ${v.url_CF ? `<a class="btn btn-main" href="${escHtml(v.url_CF)}" target="_blank" rel="noopener">${candfansText}</a>` : ""}
              ${v.url_MY ? `<a class="btn btn-sub" href="${escHtml(v.url_MY)}" target="_blank" rel="noopener">${myfansText}</a>` : ""}
            </div>
          </div>`;
      }).join("");
    }

    function renderWeeklyPicks_(data){
      if(!data || !data.weekly_picks) return false;
      const p = data.weekly_picks;
      const list = [p.s, p.a, p.bc].filter(Boolean);
      if(!list.length) return false;
      recommendationMode_ = "weekly";
      currentRecommendationList_ = list;
      renderRecommendationCards_(list);
      return true;
    }

    function drawRecommendations(){
      const data = currentContentData_;
      if(!data || !Array.isArray(data.recommendation_candidates) || !data.recommendation_candidates.length) return;

      const candidates = data.recommendation_candidates;
      const sPool = candidates.filter(v => String(v.rank || "").toUpperCase() === "S");
      const aPool = candidates.filter(v => String(v.rank || "").toUpperCase() === "A");
      const bcPool = candidates.filter(v => ["B","C"].includes(String(v.rank || "").toUpperCase()));
      const selected = [];

      const add = item => {
        if(item && !selected.some(v => String(v.video_id) === String(item.video_id))) selected.push(item);
      };
      const ids = () => selected.map(v => String(v.video_id));

      add(getRandomItem_(sPool, ids()));
      add(getRandomItem_(aPool, ids()));
      add(getRandomItem_(bcPool, ids()));

      while(selected.length < 3){
        const fallback = getRandomItem_(candidates, ids());
        if(!fallback) break;
        add(fallback);
      }

      recommendationMode_ = "random";
      currentRecommendationList_ = selected;
      renderRecommendationCards_(selected);

      const drawButton = document.getElementById("recommendDrawButton");
      const hint = document.getElementById("recommendHint");

      if(drawButton){
        drawButton.textContent =
          getLang() === "en"
            ? "🎲 Draw again"
            : "🎲 もう一度抽選する";
      }

      if(hint){
        hint.textContent =
          getLang() === "en"
            ? "Here are your 3 picks! Want to draw again?"
            : "今回はこちらの3本！もう一度引いてみる？";
      }
    }

    // ===== 作品DB =====
    async function loadVideos(){
      const nowGrid = document.getElementById("videoGrid");
      const popGrid = document.getElementById("popularGrid");
      const lang = getLang();
      const candfansText = lang === "en" ? "View on CandFans" : "CandFansで見る";
      const myfansText = lang === "en" ? "View on MyFans" : "MyFansで見る";

      const renderCard = v => {
        const title = lang === "en" && v.translation ? v.translation : v.title;
        return `
          <div class="vcard">
            ${thumbHtml(v.thumb_url || FALLBACK_IMAGE, title || "")}
            <div class="vmeta">
              <div class="vtitle">${escHtml(title || "")}</div>
              ${v.url_CF ? `<a class="btn btn-main" href="${escHtml(v.url_CF)}" target="_blank" rel="noopener">${candfansText}</a>` : ""}
              ${v.url_MY ? `<a class="btn btn-sub" href="${escHtml(v.url_MY)}" target="_blank" rel="noopener">${myfansText}</a>` : ""}
            </div>
          </div>`;
      };

      const renderLists = data => {
        currentContentData_ = data;
        const nowList = (data.myfans_latest || []).sort((a,b)=>Number(a.order)-Number(b.order)).slice(0,3);
        const emptyText = lang === "en" ? "Coming soon" : "準備中";
        nowGrid.innerHTML = nowList.length ? nowList.map(renderCard).join("") :
          `<div style="opacity:.9;font-weight:800;text-shadow:var(--textShadow);">${emptyText}</div>`;

        if(recommendationMode_ === "random" && Array.isArray(currentRecommendationList_) && currentRecommendationList_.length){
          renderRecommendationCards_(currentRecommendationList_);
        }else if(!renderWeeklyPicks_(data)){
          drawRecommendations();
        }
      };

      const cached = loadCachedContent_();
      if(cached) renderLists(cached);

      try{
        const staticData = await fetchContentJson_(CONTENT_STATIC_URL + "?v=" + Date.now());
        saveCachedContent_(staticData);
        renderLists(staticData);
        return;
      }catch(staticError){
        console.warn("Static content JSON load error:", staticError);
      }

      try{
        const gasData = await fetchContentJson_(API_URL + "?t=" + Date.now());
        saveCachedContent_(gasData);
        renderLists(gasData);
      }catch(gasError){
        console.error("Content GAS fallback error:", gasError);
        if(!cached){
          const errorText = lang === "en" ? "Failed to load" : "読み込みに失敗しました";
          nowGrid.innerHTML = `<div style="opacity:.9;font-weight:800;text-shadow:var(--textShadow);">${errorText}</div>`;
          popGrid.innerHTML = "";
        }
      }
    }

    // ===== 言語 =====
    const I18N = {
      ja:{
        htmlLang:"ja",
        title:"のあ୨୧",
        sub:"田舎で暮らす陰キャ女子",
        secCampaign:"🎉 期間限定",
        secNow:"🔥 今すぐ見る",
        secPop:"⭐ 今週のおすすめ",
        secSub:"💎 月額で全部見る"
      },
      en:{
        htmlLang:"en",
        title:"Noa",
        sub:"Quiet countryside girl",
        secCampaign:"🎉 Limited time",
        secNow:"🔥 Watch now",
        secPop:"⭐ Weekly picks",
        secSub:"💎 Subscribe monthly"
      }
    };

    function setLang(lang){
      const t = I18N[lang] || I18N.ja;

      document.documentElement.lang = t.htmlLang;
      document.getElementById("tTitle").textContent = t.title;
      document.getElementById("tSub").textContent = t.sub;
      document.getElementById("secCampaign").textContent = t.secCampaign;
      document.getElementById("secNow").textContent = t.secNow;
      document.getElementById("secPop").textContent = t.secPop;
      document.getElementById("secSub").textContent = t.secSub;
      const drawButton = document.getElementById("recommendDrawButton");
      const recommendHint = document.getElementById("recommendHint");

      if(drawButton){
        drawButton.textContent =
          recommendationMode_ === "random"
            ? (lang === "en" ? "🎲 Draw again" : "🎲 もう一度抽選する")
            : (lang === "en" ? "🎲 Draw 3 recommendations" : "🎲 おすすめ3本を抽選する");
      }

      if(recommendHint){
        recommendHint.textContent =
          recommendationMode_ === "random"
            ? (lang === "en"
                ? "Here are your 3 picks! Want to draw again?"
                : "今回はこちらの3本！もう一度引いてみる？")
            : (lang === "en"
                ? "These are this week's 3 picks! Want to draw again?"
                : "今週はこの3本！もう一度引いてみる？");
      }

      document.getElementById("btnJP")
        .classList.toggle("is-active",lang === "ja");

      document.getElementById("btnEN")
        .classList.toggle("is-active",lang === "en");

      try{
        localStorage.setItem("lang",lang);
      }catch(e){}

      /* 言語切替で各表示を再描画 */
      loadCampaigns();
      loadVideos();
    }

    (function initLang(){
      let saved = "ja";

      try{
        saved = localStorage.getItem("lang") || "ja";
      }catch(e){}

      setLang(saved === "en" ? "en" : "ja");
    })();
  </script>
</body>
