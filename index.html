<!doctype html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VSEFPGK0YZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VSEFPGK0YZ');
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Noa | links</title>
  <meta name="description" content="Noa links" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap" rel="stylesheet">

  <style>
    :root{
      --bgBase:#fff0ebff;
      --bgSize:cover; --bgRepeat:no-repeat; --bgPos:center; --bgTransition:1s;
      --veilOpacity:.30; --veilOpacityPortrait:.42;

      --fontFamily:"M PLUS Rounded 1c", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      --titleFont:"Hachi Maru Pop", cursive;

      --containerMax:760px;
      --padTop:30px; --padSide:16px; --padBottom:40px;

      --titleSize:38px; --subtitleSize:18px;
      --titleColor:#fff; --subtitleColor:rgba(255,255,255,.9);
      --textShadow:0 6px 20px rgba(0,0,0,.35);

      --cardBg:rgba(255,255,255,.25);
      --cardBorder:rgba(255,255,255,.28);
      --cardRadius:22px;
      --cardShadow:0 18px 50px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.35);

      --sectionPad:18px;
      --brand:#A67189;

      --footerColor:rgba(255,255,255,.78);
      --footerSize:12px;

      --langGap:10px;
      --langMt:14px;
      --langBtnH:34px;
      --langBtnPx:14px;
      --langBtnRadius:12px;
      --langBtnBg:rgba(255,255,255,.25);
      --langBtnBorder:rgba(255,255,255,.28);
      --langBtnText:rgba(255,255,255,.92);
      --langBtnBgActive:rgba(255,255,255,.40);
      --langBtnTextActive:rgba(255,255,255,1);
    }

    @media (max-width:420px){
      :root{
        --padTop:22px;
        --titleSize:30px; --subtitleSize:16px;
        --langBtnH:32px;
        --langBtnPx:12px;
        --sectionPad:16px;
      }
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--fontFamily);
      color:var(--titleColor);
      background-color:var(--bgBase);
      background-image:none;
      background-size:var(--bgSize);
      background-repeat:var(--bgRepeat);
      background-position:var(--bgPos);
      background-attachment:fixed;
      transition:background-image var(--bgTransition) ease-in-out;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      background:rgba(255,240,235,var(--veilOpacity));
      z-index:-1;
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:var(--padTop) var(--padSide) var(--padBottom);
      text-align:center;
      box-sizing:border-box;
    }

    .container{
      width:100%;
      max-width:760px;
      margin:0 auto;
      padding-left:max(16px, env(safe-area-inset-left));
      padding-right:max(16px, env(safe-area-inset-right));
      box-sizing:border-box;
    }

    .title{
      margin:0 0 6px;
      font-family:var(--titleFont);
      font-size:var(--titleSize);
      font-weight:900;
      text-shadow:var(--textShadow);
    }
    .subtitle{
      margin:0 0 10px;
      font-size:var(--subtitleSize);
      font-weight:800;
      color:var(--subtitleColor);
      text-shadow:var(--textShadow);
    }

    .section{
      width:100%;
      margin:0 0 16px;
      background:var(--cardBg);
      border:1px solid var(--cardBorder);
      border-radius:var(--cardRadius);
      box-shadow:var(--cardShadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      padding:var(--sectionPad);
      text-align:left;
      box-sizing:border-box;
    }

    .section h2{
      margin:0 0 12px;
      font-size:18px;
      font-weight:900;
      text-shadow:var(--textShadow);
      text-align:left;
    }

    .grid{
      display:grid;
      gap:14px;
      grid-template-columns:repeat(3, 1fr);
      align-items:stretch;
    }

    @media (orientation:portrait){
      .grid{grid-template-columns:repeat(2, 1fr)}
    }

    @media (max-width:360px){
      .grid{grid-template-columns:1fr}
    }

    .vcard{
      background:rgba(255,255,255,.20);
      border:1px solid rgba(255,255,255,.22);
      border-radius:18px;
      overflow:hidden;
      color:#fff;
      display:flex;
      flex-direction:column;
      height:100%;
      min-width:0;
    }

    .platform-name{
      padding:9px 10px 7px;
      font-size:14px;
      font-weight:900;
      text-align:center;
      text-shadow:var(--textShadow);
    }

    .thumb-wrap{
      width:100%;
      aspect-ratio:16 / 9;
      overflow:hidden;
      background:rgba(255,255,255,.18);
    }

    .thumb{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      background:transparent;
    }

    .vmeta{
      padding:10px;
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:0;
    }

    .vtitle{
      font-weight:900;
      font-size:14px;
      line-height:1.35;
      margin:0 0 10px;
      text-shadow:var(--textShadow);
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
      overflow:hidden;
      min-height:calc(14px * 1.35 * 2);
    }

    .btn{
      display:block;
      text-align:center;
      padding:10px;
      border-radius:14px;
      font-weight:900;
      text-decoration:none;
      border:1px solid rgba(255,255,255,.18);
      box-sizing:border-box;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:14px;
    }

    .vmeta .btn{margin-top:auto}

    .btn-main{
      background:var(--brand);
      color:#fff;
    }

    @media (orientation:portrait){
      .vtitle{font-size:13px; min-height:calc(13px * 1.35 * 2)}
      .btn{font-size:13px; padding:9px}
    }

    .fc-btn{
      width:100%;
      margin:0;
      padding:12px 14px;
      border-radius:14px;
    }

    .loading{
      grid-column:1 / -1;
      opacity:.9;
      font-weight:800;
      text-align:center;
      text-shadow:var(--textShadow);
      padding:8px 0;
    }

    .lang{
      margin-top:var(--langMt);
      display:flex;
      justify-content:center;
      gap:var(--langGap);
    }
    .lang button{
      height:var(--langBtnH);
      padding:0 var(--langBtnPx);
      border-radius:var(--langBtnRadius);
      background:var(--langBtnBg);
      border:1px solid var(--langBtnBorder);
      color:var(--langBtnText);
      font-weight:900;
      font-family:var(--fontFamily);
      cursor:pointer;
      text-shadow:var(--textShadow);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transition:filter .18s ease, transform .08s ease, background .18s ease, color .18s ease;
    }
    .lang button:hover{filter:brightness(1.08)}
    .lang button:active{transform:scale(.98)}
    .lang button.is-active{
      background:var(--langBtnBgActive);
      color:var(--langBtnTextActive);
    }

    .foot{
      margin-top:14px;
      font-size:var(--footerSize);
      color:var(--footerColor);
      text-shadow:var(--textShadow);
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="container">
      <h1 class="title" id="tTitle">のあ୨୧</h1>
      <p class="subtitle" id="tSub">田舎で暮らす陰キャ女子</p>

      <div class="section" aria-label="Latest social posts">
        <h2 id="secSocial">📱 SNSをチェックする</h2>
        <div class="grid" id="snsGrid">
          <div class="loading">読み込み中...</div>
        </div>
      </div>

      <div class="section" aria-label="Fan club list">
        <h2 id="secFanclub">🔞 18歳以上はこちら</h2>
        <a
          class="btn btn-main fc-btn"
          id="fanclubLink"
          href="https://noanoshita.com/verify/"
          aria-label="ファンクラブ一覧"
        >ファンクラブ一覧</a>
      </div>

      <div class="lang" aria-label="Language switch">
        <button id="btnJP" type="button" onclick="setLang('ja')">JP</button>
        <button id="btnEN" type="button" onclick="setLang('en')">EN</button>
      </div>

      <div class="foot">© Noa</div>
    </div>
  </div>

  <script>
    // ===== 背景画像（ルート直下のindex.htmlから参照） =====
    const BG = {
      morning:"/images/morning.png",
      evening:"/images/evening.jpg",
      night:"/images/night.jpg"
    };

    function pickBgByTime(){
      const h = new Date().getHours();
      if(h >= 5 && h < 16) return BG.morning;
      if(h >= 16 && h < 19) return BG.evening;
      return BG.night;
    }

    function applyBgModeByAspect(imgUrl){
      const img = new Image();
      img.onload = () => {
        const portrait = img.naturalHeight > img.naturalWidth;
        document.documentElement.style.setProperty('--bgSize', portrait ? 'contain' : 'cover');
        document.documentElement.style.setProperty(
          '--veilOpacity',
          portrait
            ? getComputedStyle(document.documentElement).getPropertyValue('--veilOpacityPortrait').trim()
            : '.30'
        );
        document.body.style.backgroundColor = getComputedStyle(document.documentElement)
          .getPropertyValue('--bgBase').trim();
      };
      img.onerror = () => {
        document.documentElement.style.setProperty('--bgSize', 'cover');
        document.documentElement.style.setProperty('--veilOpacity', '.30');
      };
      img.src = imgUrl;
    }

    function setBG(){
      const imgUrl = pickBgByTime();
      document.body.style.backgroundImage = `url('${imgUrl}')`;
      applyBgModeByAspect(imgUrl);
    }
    setBG();

    // ===== SNS同期API =====
    const SNS_API_URL = "https://script.google.com/macros/s/AKfycbyV4N5O_3INXD4ry7lWM8HoYIsHjPSAHO_0BSSY1_m5fwQQ7H940VyCgAbU_eBGTW5C/exec";

    // Xの自動取得が完成するまで使用する仮サムネイル
    const PLACEHOLDER_THUMB = "/images/NY.jpg";

    const SNS_LINKS = {
      youtube:"https://www.youtube.com/@challengenoa",
      instagram:"https://www.instagram.com/noanoshita/",
      x:"https://x.com/noanoshita"
    };

    function escHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getLang(){
      try{
        return localStorage.getItem("lang") === "en" ? "en" : "ja";
      }catch(e){
        return "ja";
      }
    }

    function buildSnsCard(item){
      return `
        <div class="vcard">
          <div class="platform-name">${escHtml(item.platform)}</div>
          <div class="thumb-wrap">
            <img class="thumb" src="${escHtml(item.thumb)}" alt="${escHtml(item.platform)} 最新投稿">
          </div>
          <div class="vmeta">
            <div class="vtitle">${escHtml(item.title)}</div>
            <a
              class="btn btn-main"
              href="${escHtml(item.url)}"
              target="_blank"
              rel="noopener"
              data-platform="${escHtml(item.key)}"
            >${escHtml(item.button)}</a>
          </div>
        </div>
      `;
    }

    async function loadLatestSns(){
      const grid = document.getElementById("snsGrid");
      const lang = getLang();
      const t = I18N[lang] || I18N.ja;

      let youtube = null;
      let instagram = null;

      try{
        const response = await fetch(SNS_API_URL + "?t=" + Date.now(), {cache:"no-store"});
        if(!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        youtube = data.youtube_latest || null;
        instagram = data.instagram_latest || null;
      }catch(error){
        console.error("SNS API load error:", error);
      }

      const items = [
        {
          key:"youtube",
          platform:"YouTube",
          title:youtube && youtube.title ? youtube.title : t.youtubeFallback,
          thumb:youtube && youtube.thumb_url ? youtube.thumb_url : PLACEHOLDER_THUMB,
          url:youtube && youtube.url ? youtube.url : SNS_LINKS.youtube,
          button:t.youtubeButton
        },
        {
          key:"instagram",
          platform:"Instagram",
          title:instagram && instagram.title ? instagram.title : t.instagramFallback,
          thumb:instagram && instagram.thumb_url ? instagram.thumb_url : PLACEHOLDER_THUMB,
          url:instagram && instagram.url ? instagram.url : SNS_LINKS.instagram,
          button:t.instagramButton
        },
        {
          key:"x",
          platform:"X",
          title:t.xPending,
          thumb:PLACEHOLDER_THUMB,
          url:SNS_LINKS.x,
          button:t.xButton
        }
      ];

      grid.innerHTML = items.map(buildSnsCard).join("");

      grid.querySelectorAll("a[data-platform]").forEach(link => {
        link.addEventListener("click", () => {
          try{
            gtag("event", "click_latest_sns", {
              event_category:"sns",
              event_label:link.dataset.platform
            });
          }catch(e){}
        });
      });
    }

    const I18N = {
      ja:{
        htmlLang:"ja",
        title:"のあ୨୧",
        sub:"田舎で暮らす陰キャ女子",
        secSocial:"📱 SNSをチェックする",
        secFanclub:"🔞 18歳以上はこちら",
        fanclubButton:"ファンクラブ一覧",
        youtubeButton:"YouTubeで見る",
        instagramButton:"Instagramで見る",
        xButton:"Xで見る",
        youtubeFallback:"最新動画をYouTubeで見る",
        instagramFallback:"最新投稿をInstagramで見る",
        xPending:"最新投稿は準備中です"
      },
      en:{
        htmlLang:"en",
        title:"Noa",
        sub:"Quiet countryside girl",
        secSocial:"📱 Check my social media",
        secFanclub:"🔞 For adults only",
        fanclubButton:"Fan club list",
        youtubeButton:"Watch on YouTube",
        instagramButton:"View on Instagram",
        xButton:"View on X",
        youtubeFallback:"Watch the latest video on YouTube",
        instagramFallback:"View the latest post on Instagram",
        xPending:"Latest post coming soon"
      }
    };

    function setLang(lang){
      const t = I18N[lang] || I18N.ja;
      document.documentElement.lang = t.htmlLang;

      document.getElementById("tTitle").textContent = t.title;
      document.getElementById("tSub").textContent = t.sub;
      document.getElementById("secSocial").textContent = t.secSocial;
      document.getElementById("secFanclub").textContent = t.secFanclub;
      document.getElementById("fanclubLink").textContent = t.fanclubButton;

      document.getElementById("btnJP").classList.toggle("is-active", lang === "ja");
      document.getElementById("btnEN").classList.toggle("is-active", lang === "en");

      try{localStorage.setItem("lang", lang)}catch(e){}
      loadLatestSns();
    }

    (function initLang(){
      let saved = "ja";
      try{saved = localStorage.getItem("lang") || "ja"}catch(e){}
      setLang(saved === "en" ? "en" : "ja");
    })();
  </script>
</body>
</html>
